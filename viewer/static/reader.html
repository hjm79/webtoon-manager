<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="webtoon-base-path" content="__WEBTOON_BASE_PATH__">
<script src="__WEBTOON_BASE_PATH__/base-path.js"></script>
<title>읽는 중...</title>
<link rel="icon" href="__WEBTOON_BASE_PATH__/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="__WEBTOON_BASE_PATH__/icons/apple-touch-icon.png">
<link rel="manifest" href="__WEBTOON_BASE_PATH__/manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="웹툰">
<link rel="stylesheet" href="__WEBTOON_BASE_PATH__/style.css?v=reader-controls-5">
</head>
<body class="reader-body">
<header class="reader-topbar" id="topbar">
  <div class="reader-topbar-row">
    <a class="back" id="backLink" href="__WEBTOON_BASE_PATH__/" aria-label="웹툰 목록으로" title="웹툰 목록으로">←</a>
    <div class="reader-heading">
      <span id="chapterTitle"></span>
      <span id="readerPosition" role="status" aria-live="off"></span>
    </div>
    <button class="reader-control" id="fullscreenToggle" type="button" aria-label="전체 화면" title="전체 화면">
      <svg id="fullscreenEnterIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="8 3 3 3 3 8"></polyline>
        <polyline points="16 3 21 3 21 8"></polyline>
        <polyline points="8 21 3 21 3 16"></polyline>
        <polyline points="16 21 21 21 21 16"></polyline>
      </svg>
      <svg id="fullscreenExitIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
        <polyline points="9 3 9 9 3 9"></polyline>
        <polyline points="15 3 15 9 21 9"></polyline>
        <polyline points="9 21 9 15 3 15"></polyline>
        <polyline points="15 21 15 15 21 15"></polyline>
      </svg>
    </button>
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="회차 목록" title="회차 목록">≡</button>
  </div>
  <div class="reader-position-row">
    <button id="previousChapter" type="button" disabled>이전 화</button>
    <button id="chapterTop" type="button" title="현재 회차 맨 위">회차 처음</button>
    <button id="chapterBottom" type="button" title="현재 회차 맨 아래">회차 끝</button>
    <button id="nextChapter" type="button" disabled>다음 화</button>
    <span class="reader-controls-spacer" aria-hidden="true"></span>
    <button class="reader-control auto-scroll-control" id="autoScrollToggle" type="button" aria-label="자동 스크롤 시작" aria-pressed="false" title="자동 스크롤 시작 (Space)">▶ 자동</button>
    <button class="reader-control speed-control" id="scrollSpeedToggle" type="button" aria-label="스크롤 속도" title="스크롤 속도">1x</button>
  </div>
  <progress id="chapterProgress" class="reader-chapter-progress" value="0" max="1" aria-label="회차 내 페이지 위치"></progress>
</header>

<div id="readerQuickTools" class="reader-quick-tools" role="group" aria-label="리더 빠른 도구" hidden>
  <button id="showReaderTools" type="button" aria-controls="topbar zoomBar">도구 보기</button>
  <button id="stopHiddenAutoScroll" type="button" aria-label="자동 스크롤 정지" hidden>자동 정지</button>
</div>

<div class="reader-zoom-bar" id="zoomBar">
  <span class="reader-zoom-icon" aria-hidden="true">－</span>
  <input type="range" id="zoomSlider" class="reader-zoom-slider" min="50" max="100" step="5" value="100" aria-label="이미지 크기">
  <span class="reader-zoom-icon" aria-hidden="true">＋</span>
  <span id="zoomValueLabel" class="reader-zoom-value">100%</span>
</div>

<div id="pages" class="pages"></div>
<div id="positioningOverlay" class="positioning-overlay" style="display:none">이어보던 위치로 이동 중…</div>
<div id="progressSaveError" class="reader-save-error" role="alert" hidden>
  <span>읽은 위치를 저장하지 못해 닫지 않았습니다. 연결을 확인하고 다시 시도해주세요.</span>
  <button id="retrySaveAndClose" type="button">다시 저장하고 닫기</button>
</div>

<aside id="sidebar" class="sidebar" role="dialog" aria-modal="true" aria-labelledby="sidebarTitle" inert>
  <div class="sidebar-header">
    <span id="sidebarTitle">회차 목록</span>
    <button id="sidebarClose" class="sidebar-close" type="button" aria-label="회차 목록 닫기">×</button>
  </div>
  <div class="reader-sidebar-tools">
    <div class="reader-sidebar-search">
      <input type="search" id="sidebarSearch" aria-label="회차 번호 또는 제목 검색" placeholder="회차 번호 또는 제목" autocomplete="off">
      <button type="button" id="clearSidebarSearch" disabled>지우기</button>
    </div>
    <div class="reader-sidebar-actions">
      <select id="sidebarEpisodeOrder" aria-label="회차 정렬">
        <option value="latest">최신순</option>
        <option value="oldest">오래된순</option>
      </select>
      <button type="button" id="focusCurrentChapter">현재 회차</button>
    </div>
  </div>
  <p id="sidebarSearchEmpty" class="reader-sidebar-empty" role="status" hidden>검색 결과가 없습니다.</p>
  <div id="sidebarList" class="sidebar-list"></div>
</aside>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<script src="embed.js"></script>
<script src="reader-position.js?v=2"></script>
<script src="reader-images.js?v=2"></script>
<script src="reader-progress.js?v=3"></script>
<script>
// index.html과 동일한 방식 - 공유 프로필 링크("/p/<토큰>/...")로 접속했는지 감지해서,
// 이 화면에서 나가는 모든 /api/* 요청에 자동으로 그 토큰 경로를 붙인다.
const PROFILE_TOKEN = WebtoonPaths.profileToken;
const IS_PROFILE_VIEW = PROFILE_TOKEN !== null;
window.fetch = WebtoonPaths.fetch;

function withProfilePrefix(path) {
  return WebtoonPaths.path(path);
}
document.querySelector('link[rel="manifest"]').href = withProfilePrefix("/manifest.json");

const params = new URLSearchParams(location.search);
const seriesId = params.get("series");
let initialChapterId = params.get("chapter");
let initialPage = parseInt(params.get("page") || "0", 10) || 0;
let initialOffset = WebtoonReaderPosition.pageOffset(Number(params.get("page_offset") || 0));
const embedRequested = params.get("embed") === "1";
let embedBridge = null;

async function initializeEmbed() {
  if (!embedRequested) return true;
  try {
    const response = await fetch("/api/embed/config");
    if (!response.ok) throw new Error("embed config unavailable");
    const config = await response.json();
    embedBridge = WebtoonReaderEmbed.createBridge({
      window,
      parentOrigin: params.get("parent_origin"),
      allowedOrigins: [...new Set([location.origin, ...(config.allowed_origins || [])])],
      onClose: () => leaveReaderForList(),
    });
    if (!embedBridge.active) throw new Error("parent origin not allowed");
    document.body.classList.add("reader-embedded");
    const backLink = document.getElementById("backLink");
    backLink.setAttribute("aria-label", "관리기로 돌아가기");
    backLink.title = "관리기로 돌아가기";
    return true;
  } catch (_) {
    pagesEl.textContent = "이 관리기에서는 내장 읽기가 허용되지 않습니다. 별도 뷰어에서 열어주세요.";
    return false;
  }
}

function postReaderEvent(type, payload = {}) {
  if (embedBridge) embedBridge.post(type, { series_id: seriesId, ...payload });
}

function setProgressSaveError(visible) {
  const banner = document.getElementById("progressSaveError");
  banner.hidden = !visible;
  const label = banner.querySelector?.("span");
  if (label) label.textContent = "읽은 위치를 저장하지 못해 닫지 않았습니다. 연결을 확인하고 다시 시도해주세요.";
}

document.getElementById("backLink").href = withProfilePrefix("/");

let seriesData = null;       // { title, platform, chapters: [...] } (오름차순)
let loadedChapters = [];     // 이 화면에 이미 붙인 회차들 (진행 순서대로)
let currentChapterId = null;
let pendingJumpChapterId = null;
let readingFromChapterId = null;
const readingEvidence = WebtoonReaderProgress.createReadingEvidence();
const completedChapters = new Set();
const persistedCompletedChapters = new Set();
let completedChapterPosition = null;
let progressRevision = 0;
let savedProgressRevision = 0;
let hasReadingInput = false;
let readingInputUntil = 0;
let closingProgressSaved = false;
let currentPageIndex = 0;
let currentPageOffset = 0;
let isLoadingNext = false;

// 리더 화면별 UI 설정: 전체화면 / 스크롤 속도 / 확대·축소.
// 이 세 가지를 웹툰마다 따로 기억할지, 어디서 바꾸든 전체 공통으로 적용할지는
// 설정 패널(목록 화면 ⚙)에서 고른 값(READER_SCOPE_SETTING_KEY)을 따른다.
const READER_SCOPE_SETTING_KEY = "reader_settings_scope";
let readerSettingsScope = "global"; // "global" | "per_series" - load()에서 서버 값으로 갱신됨

function readerSettingKey(baseKey) {
  return readerSettingsScope === "per_series" ? `${baseKey}:${seriesId}` : baseKey;
}

function localCacheKey(baseKey) {
  // localStorage는 브라우저 전체(도메인 단위)에서 공유되므로, 관리자/여러 프로필을
  // 같은 브라우저로 오가면 이 캐시값이 서로 섞여 보일 수 있다(서버에 값이 오기 전
  // 아주 잠깐 동안). 프로필 토큰을 붙여서 이 캐시만큼은 완전히 분리한다 - 서버 쪽
  // API 키(readerSettingKey)는 요청 컨텍스트로 이미 프로필별로 분리되어 있으니
  // 그대로 두고, 여기 로컬 캐시 키에만 추가로 붙인다.
  return `${readerSettingKey(baseKey)}:${PROFILE_TOKEN || "admin"}`;
}

function cachedReaderPreference(key) {
  try { return localStorage.getItem(key); } catch (_) { return null; }
}

function cacheReaderPreference(key, value) {
  try { localStorage.setItem(key, value); } catch (_) { /* Server settings remain available. */ }
}

async function loadReaderSettingsScope() {
  try {
    const res = await fetch(`/api/settings/${READER_SCOPE_SETTING_KEY}`);
    if (res.ok) {
      const data = await res.json();
      if (data.value === "per_series") readerSettingsScope = "per_series";
    }
  } catch (e) {
    // 못 받아와도 기본값(전체 공통)으로 계속 진행
  }
}

const FULLSCREEN_BASE_KEY = "reader_fullscreen";
const SCROLL_SPEED_BASE_KEY = "reader_scroll_speed";
const SCROLL_SPEEDS = [0.5, 0.75, 1, 1.5, 1.75, 2, 3];
const DEFAULT_SCROLL_SPEED = 1;
const SCROLL_PIXELS_PER_SECOND = 450;
let scrollSpeed = DEFAULT_SCROLL_SPEED;
let scrollAnimationFrame = null;
let scrollDirection = 0;
let fullscreenPreference = false;

const pagesEl = document.getElementById("pages");
const chapterTitleEl = document.getElementById("chapterTitle");
const sidebarListEl = document.getElementById("sidebarList");
const sidebarEpisodeOrderEl = document.getElementById("sidebarEpisodeOrder");
const fullscreenToggleEl = document.getElementById("fullscreenToggle");
const fullscreenEnterIconEl = document.getElementById("fullscreenEnterIcon");
const fullscreenExitIconEl = document.getElementById("fullscreenExitIcon");
const scrollSpeedToggleEl = document.getElementById("scrollSpeedToggle");
const autoScrollToggleEl = document.getElementById("autoScrollToggle");
const stopHiddenAutoScrollEl = document.getElementById("stopHiddenAutoScroll");
const zoomSliderEl = document.getElementById("zoomSlider");
const zoomValueLabelEl = document.getElementById("zoomValueLabel");
const readerPositionEl = document.getElementById("readerPosition");
const chapterProgressEl = document.getElementById("chapterProgress");
const previousChapterEl = document.getElementById("previousChapter");
const nextChapterEl = document.getElementById("nextChapter");
const progressWriter = WebtoonReaderProgress.createWriter({
  send: (body, { keepalive }) => fetch(`/api/series/${encodeURIComponent(seriesId)}/progress`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive,
    signal: globalThis.AbortSignal?.timeout?.(5_000),
  }),
});

function showError() {
  stopAutoScroll();
  pagesEl.innerHTML = `<div class="empty-state">회차를 불러올 수 없습니다.</div>`;
  postReaderEvent("error", { message: "회차를 불러올 수 없습니다." });
}

function readingTimeMessage(windows) {
  const dayLabels = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];
  const formatMinutes = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const scheduleText = (windows || [])
    .map((w) => `${dayLabels[w.day_of_week]} ${formatMinutes(w.start_minute)}~${formatMinutes(w.end_minute)}`)
    .join(", ");
  return `지금은 이 회차를 읽을 수 있는 시간이 아닙니다. 웹툰은 ${scheduleText || "정해진 시간"}에 볼 수 있습니다. 요일과 시간 변경은 관리자에게 요청해주세요.`;
}

let positioningTimer = null;
const positioningOverlayEl = document.getElementById("positioningOverlay");

function beginPositioning() {
  pagesEl.classList.add("positioning");
  positioningOverlayEl.style.display = "flex";
}

function revealPages() {
  clearTimeout(positioningTimer);
  pagesEl.classList.remove("positioning");
  positioningOverlayEl.style.display = "none";
}

function chapterById(id) {
  return seriesData.chapters.find((c) => c.id === id) || null;
}

function chapterIndexById(id) {
  return seriesData.chapters.findIndex((c) => c.id === id);
}

// ---------------------------------------------------------------------
// 리더 화면 설정: 회차별 전체 화면 + 연속 스크롤
// ---------------------------------------------------------------------

function fullscreenSettingKey() {
  return readerSettingKey(FULLSCREEN_BASE_KEY);
}

async function readFullscreenPreference() {
  // 서버 설정을 우선 사용하되, 서버에 값이 없거나 요청에 실패하면
  // 기존 브라우저의 localStorage 값도 사용할 수 있게 한다.
  const localValue = cachedReaderPreference(localCacheKey(FULLSCREEN_BASE_KEY));
  if (localValue !== null) fullscreenPreference = localValue === "1";

  try {
    const res = await fetch(`/api/settings/${encodeURIComponent(fullscreenSettingKey())}`);
    if (res.ok) {
      const data = await res.json();
      if (data.value === "1" || data.value === "0") {
        fullscreenPreference = data.value === "1";
        cacheReaderPreference(localCacheKey(FULLSCREEN_BASE_KEY), data.value);
      }
    }
  } catch (e) {
    // 서버 설정을 읽지 못해도 로컬 설정으로 계속 사용할 수 있다.
  }
}

async function writeFullscreenPreference(enabled) {
  fullscreenPreference = enabled;
  cacheReaderPreference(localCacheKey(FULLSCREEN_BASE_KEY), enabled ? "1" : "0");
  try {
    await fetch(`/api/settings/${encodeURIComponent(fullscreenSettingKey())}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: enabled ? "1" : "0" }),
    });
  } catch (e) {
    // 로컬 저장은 이미 끝났으므로 서버 저장 실패가 리더 사용을 막지 않게 한다.
  }
}

function updateFullscreenButton() {
  const active = document.body.classList.contains("reader-fullscreen");
  fullscreenEnterIconEl.style.display = active ? "none" : "block";
  fullscreenExitIconEl.style.display = active ? "block" : "none";
  fullscreenToggleEl.setAttribute("aria-label", active ? "전체 화면 해제" : "전체 화면");
  fullscreenToggleEl.title = active ? "전체 화면 해제" : "전체 화면";
}

async function enterBrowserFullscreen() {
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
    try {
      await document.documentElement.requestFullscreen();
    } catch (e) {
      // 브라우저 보안 정책상 사용자 제스처가 필요한 경우가 있으므로
      // 아래의 앱 전체 화면 모드는 그대로 유지한다.
    }
  }
}

async function exitBrowserFullscreen() {
  if (document.fullscreenElement && document.exitFullscreen) {
    try {
      await document.exitFullscreen();
    } catch (e) {}
  }
}

function setReaderFullscreen(enabled, { persist = true, requestBrowserFullscreen = false } = {}) {
  // 전체화면 전환 자체도 모든 이미지 크기를 바꾸는 일이라, 전환 전/후 같은 지점을 유지하려면
  // 클래스를 바꾸기 "전"에 미리 기준점을 잡아둬야 한다 (바꾼 뒤에 잡으면 이미 크기가
  // 한 번 틀어진 상태를 기준으로 잡게 되어 오히려 위치가 어긋난다).
  const anchor = captureScrollAnchor();
  document.body.classList.toggle("reader-fullscreen", enabled);
  if (persist) writeFullscreenPreference(enabled);
  updateFullscreenButton();
  setZoomCssVariable(); // 전체화면 여부에 따라 확대/축소 기준폭이 달라지므로 즉시 다시 계산
  restoreScrollAnchor(anchor);

  if (enabled && requestBrowserFullscreen) {
    enterBrowserFullscreen();
  } else if (!enabled) {
    exitBrowserFullscreen();
  }
}

fullscreenToggleEl.addEventListener("click", () => {
  const enabled = !document.body.classList.contains("reader-fullscreen");
  setReaderFullscreen(enabled, { persist: true, requestBrowserFullscreen: enabled });
});

document.addEventListener("fullscreenchange", () => {
  // Esc 등으로 브라우저 전체 화면을 빠져나와도 사용자가 저장한
  // 웹툰별 전체 화면 선호 상태는 유지한다. 따라서 다음 진입 때 다시 적용한다.
  updateFullscreenButton();
});

async function leaveReaderForList(event) {
  if (event) event.preventDefault();
  stopAutoScroll();
  stopContinuousScroll();
  // 판정은 리더 화면의 크기가 바뀌기 전에 처리한다. iframe이 닫힐 때는
  // pagehide가 이미 확인한 완독 위치를 다시 덮어쓰지 않도록 한다.
  if (embedBridge?.active) {
    const saved = await saveProgressNow({ keepalive: true });
    if (!saved) return;
    closingProgressSaved = true;
  }
  // 웹툰 목록으로 돌아갈 때는 브라우저 전체 화면과 리더 전체 화면을 모두 해제한다.
  document.body.classList.remove("reader-fullscreen");
  await exitBrowserFullscreen();
  updateFullscreenButton();
  if (embedBridge?.active) {
    postReaderEvent("close", { chapter_id: currentChapterId, page_index: currentPageIndex });
    return;
  }
  window.location.href = withProfilePrefix("/");
}

document.getElementById("backLink").addEventListener("click", leaveReaderForList);
document.getElementById("retrySaveAndClose").addEventListener("click", leaveReaderForList);

async function loadScrollSpeed() {
  // 서버 설정을 우선 사용하되, 서버에 값이 없거나 요청에 실패하면
  // 기존 브라우저의 localStorage 값도 사용할 수 있게 한다 (전체화면 설정과 동일한 방식).
  const key = readerSettingKey(SCROLL_SPEED_BASE_KEY);
  const localKey = localCacheKey(SCROLL_SPEED_BASE_KEY);
  const localValue = parseFloat(cachedReaderPreference(localKey) || "");
  if (SCROLL_SPEEDS.includes(localValue)) scrollSpeed = localValue;

  try {
    const res = await fetch(`/api/settings/${encodeURIComponent(key)}`);
    if (res.ok) {
      const data = await res.json();
      const serverValue = parseFloat(data.value || "");
      if (SCROLL_SPEEDS.includes(serverValue)) {
        scrollSpeed = serverValue;
        cacheReaderPreference(localKey, String(serverValue));
      }
    }
  } catch (e) {
    // 서버 설정을 읽지 못해도 로컬 설정으로 계속 사용할 수 있다.
  }
  scrollSpeedToggleEl.textContent = `${scrollSpeed}x`;
  scrollSpeedToggleEl.title = `스크롤 속도 ${scrollSpeed}x (자동 시작/정지는 옆 버튼)`;
}

function saveScrollSpeed() {
  const key = readerSettingKey(SCROLL_SPEED_BASE_KEY);
  cacheReaderPreference(localCacheKey(SCROLL_SPEED_BASE_KEY), String(scrollSpeed));
  fetch(`/api/settings/${encodeURIComponent(key)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value: String(scrollSpeed) }),
  }).catch(() => {}); // 실패해도 로컬엔 이미 저장됐으니 기능은 그대로 동작
}

function cycleScrollSpeed() {
  const index = SCROLL_SPEEDS.indexOf(scrollSpeed);
  scrollSpeed = SCROLL_SPEEDS[(index + 1) % SCROLL_SPEEDS.length];
  scrollSpeedToggleEl.textContent = `${scrollSpeed}x`;
  scrollSpeedToggleEl.title = `스크롤 속도 ${scrollSpeed}x (자동 시작/정지는 옆 버튼)`;
  saveScrollSpeed();
}

scrollSpeedToggleEl.addEventListener("click", (event) => {
  event.stopPropagation();
  cycleScrollSpeed();
});

function stopContinuousScroll() {
  scrollDirection = 0;
  if (scrollAnimationFrame !== null) {
    cancelAnimationFrame(scrollAnimationFrame);
    scrollAnimationFrame = null;
  }
}

function startContinuousScroll(direction) {
  stopAutoScroll(); // 자동 스크롤과 동시에 돌면 서로 속도가 겹쳐 엉킬 수 있어 우선 멈춤
  if (scrollDirection === direction && scrollAnimationFrame !== null) return;
  scrollDirection = direction;
  let lastTime = performance.now();

  const step = (now) => {
    if (scrollDirection !== direction) {
      scrollAnimationFrame = null;
      return;
    }
    const elapsed = Math.min(now - lastTime, 50) / 1000;
    lastTime = now;
    window.scrollBy(0, direction * SCROLL_PIXELS_PER_SECOND * scrollSpeed * elapsed);
    scrollAnimationFrame = requestAnimationFrame(step);
  };

  if (scrollAnimationFrame !== null) cancelAnimationFrame(scrollAnimationFrame);
  scrollAnimationFrame = requestAnimationFrame(step);
}

// 자동 스크롤은 버튼 또는 Space로 조작하며 속도 설정을 따른다.
// 켜짐 여부는 일부러 저장하지 않는다 - 리더를 새로 열 때마다 항상 꺼진 상태로 시작한다.
let autoScrollActive = false;
let autoScrollFrame = null;

function updateAutoScrollButton() {
  autoScrollToggleEl.textContent = autoScrollActive ? "Ⅱ 정지" : "▶ 자동";
  autoScrollToggleEl.setAttribute("aria-pressed", String(autoScrollActive));
  autoScrollToggleEl.setAttribute("aria-label", autoScrollActive ? "자동 스크롤 정지" : "자동 스크롤 시작");
  autoScrollToggleEl.title = autoScrollActive ? "자동 스크롤 정지 (Space)" : "자동 스크롤 시작 (Space)";
  stopHiddenAutoScrollEl.hidden = !autoScrollActive;
}

function startAutoScroll() {
  if (autoScrollActive || document.getElementById("sidebar").classList.contains("open")) return;
  stopContinuousScroll(); // 방향키 연속 스크롤과 동시에 돌면 속도가 겹쳐 엉킬 수 있어 우선 멈춤
  autoScrollActive = true;
  noteReadingInput();
  updateAutoScrollButton();
  let lastTime = performance.now();

  const step = (now) => {
    if (!autoScrollActive) {
      autoScrollFrame = null;
      return;
    }
    const elapsed = Math.min(now - lastTime, 50) / 1000;
    lastTime = now;
    for (const img of visiblePages.values()) {
      if (img.dataset.imageState !== "failed" || !img.isConnected) continue;
      const rect = img.getBoundingClientRect();
      if (rect.bottom > 0 && rect.top < window.innerHeight) {
        stopAutoScroll();
        return;
      }
    }
    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 1) {
      // The observer can run after the scroll frame that first reaches the boundary.
      if (!isLoadingNext && !pagesEl.querySelector(".reader-next-boundary")) {
        stopAutoScroll();
        return;
      }
    } else {
      window.scrollBy(0, SCROLL_PIXELS_PER_SECOND * scrollSpeed * elapsed);
    }
    autoScrollFrame = requestAnimationFrame(step);
  };

  autoScrollFrame = requestAnimationFrame(step);
}

function stopAutoScroll() {
  autoScrollActive = false;
  updateAutoScrollButton();
  if (autoScrollFrame !== null) {
    cancelAnimationFrame(autoScrollFrame);
    autoScrollFrame = null;
  }
}

function toggleAutoScroll() {
  if (autoScrollActive) stopAutoScroll();
  else startAutoScroll();
}
autoScrollToggleEl.addEventListener("click", toggleAutoScroll);

// 화면 한 칸(뷰포트 높이의 90%)만큼 이전/다음으로 건너뛴다. 10%를 겹치게 남겨두는 이유는
// 전자책/PDF 리더에서 흔히 쓰는 관례와 같다 - 겹치는 부분이 없으면 경계에 걸친 말풍선/컷을
// 놓치기 쉽고, 반대로 너무 많이 겹치면 한 번에 넘어가는 양이 적어 답답해진다. 웹툰도 세로로
// 긴 컷이 페이지 경계에 걸리는 경우가 잦아 같은 논리가 적용된다.
const PAGE_JUMP_OVERLAP_RATIO = 0.1;

function jumpScreen(direction) {
  stopContinuousScroll(); // 혹시 연속 스크롤 중이었다면 멈추고 한 번만 이동
  stopAutoScroll(); // 자동 스크롤 중이었다면 그것도 멈춤(수동 이동과 동시에 돌면 헷갈림)
  const jumpDistance = window.innerHeight * (1 - PAGE_JUMP_OVERLAP_RATIO);
  window.scrollBy({ top: direction * jumpDistance, left: 0, behavior: "smooth" });
}

function handleScrollKeyDown(event) {
  if (document.getElementById("sidebar").classList.contains("open")) return;
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON" || event.ctrlKey || event.metaKey || event.altKey) {
    return;
  }

  // 스페이스바: 자동 스크롤 켜기/끄기. 기본 동작(스페이스 = 페이지 다운 스크롤)이
  // 겹치면 이중으로 움직이니 반드시 막아야 하고, 키를 누르고 있어도(반복 이벤트)
  // 한 번만 토글되게 event.repeat로 걸러낸다.
  if (event.key === " " || event.code === "Space") {
    event.preventDefault();
    if (!event.repeat) toggleAutoScroll();
    return;
  }

  if (event.key === "Home" || event.key === "End") {
    pauseReaderScrolling();
    return;
  }

  // 위/아래 방향키(+볼륨키)는 누르고 있으면 계속 스크롤되는 기존 동작을 그대로 유지한다.
  let holdDirection = 0;
  if (event.key === "ArrowUp" || event.key === "AudioVolumeDown") holdDirection = -1;
  if (event.key === "ArrowDown" || event.key === "AudioVolumeUp") holdDirection = 1;
  if (holdDirection) {
    event.preventDefault();
    startContinuousScroll(holdDirection);
    return;
  }

  // 좌/우 방향키와 페이지업/다운은 누르고 있어도 "원클릭" 기준으로 한 번만 화면 단위로
  // 건너뛴다. event.repeat는 키를 누르고 있을 때 OS가 자동으로 반복 발생시키는
  // keydown인지 구분해주는 표준 속성이라, 이걸로 실제 첫 입력만 걸러낸다.
  if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    if (!event.repeat) jumpScreen(-1);
    return;
  }
  if (event.key === "ArrowRight" || event.key === "PageDown") {
    event.preventDefault();
    if (!event.repeat) jumpScreen(1);
    return;
  }
}

function handleScrollKeyUp(event) {
  if (
    event.key === "ArrowUp" || event.key === "AudioVolumeDown" ||
    event.key === "ArrowDown" || event.key === "AudioVolumeUp"
  ) {
    event.preventDefault();
    stopContinuousScroll();
  }
}

window.addEventListener("keydown", handleScrollKeyDown, { passive: false });
window.addEventListener("keyup", handleScrollKeyUp, { passive: false });
function pauseReaderScrolling() {
  stopContinuousScroll();
  stopAutoScroll();
}
window.addEventListener("blur", pauseReaderScrolling);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseReaderScrolling();
});
window.addEventListener("wheel", pauseReaderScrolling, { passive: true });
function pauseForManualPointer(event) {
  if (!event.target.closest("#autoScrollToggle, #scrollSpeedToggle, #showReaderTools, #stopHiddenAutoScroll")) pauseReaderScrolling();
}
window.addEventListener("touchstart", pauseForManualPointer, { passive: true });
window.addEventListener("pointerdown", pauseForManualPointer, { passive: true });

// ---------------------------------------------------------------------
// 이미지 확대/축소
//
// transform: scale()는 안 쓴다 - 실제 레이아웃 크기가 그대로라 스크롤 위치 계산
// (읽음 진행률 추적, IntersectionObserver 등)이 전부 어긋나기 때문. 대신 이미지의
// width 자체를 바꿔서 실제 문서 높이가 정직하게 늘어나거나 줄어들게 한다 - 화질이
// 깨지는 것도 아니고(브라우저의 일반적인 이미지 리사이즈와 동일한 방식), 다른 기능과도
// 자연스럽게 맞물린다.
// ---------------------------------------------------------------------

const ZOOM_BASE_KEY = "reader_zoom_percent";
const ZOOM_MIN = parseInt(zoomSliderEl.min, 10); // 너무 작아져서 못 읽는 수준까지는 안 내려가게 슬라이더 자체에 하한을 둠
const ZOOM_MAX = parseInt(zoomSliderEl.max, 10);
const ZOOM_BASE_WIDTH = 720; // 기존 기본 이미지 최대 폭(px)과 동일한 기준
let zoomPercent = 100;

async function loadZoomPercent() {
  // 서버 설정을 우선 사용하되, 서버에 값이 없거나 요청에 실패하면
  // 기존 브라우저의 localStorage 값도 사용할 수 있게 한다 (전체화면 설정과 동일한 방식).
  const key = readerSettingKey(ZOOM_BASE_KEY);
  const localKey = localCacheKey(ZOOM_BASE_KEY);
  const localValue = parseInt(cachedReaderPreference(localKey) || "", 10);
  if (Number.isFinite(localValue) && localValue >= ZOOM_MIN && localValue <= ZOOM_MAX) {
    zoomPercent = localValue;
  }

  try {
    const res = await fetch(`/api/settings/${encodeURIComponent(key)}`);
    if (res.ok) {
      const data = await res.json();
      const serverValue = parseInt(data.value || "", 10);
      if (Number.isFinite(serverValue) && serverValue >= ZOOM_MIN && serverValue <= ZOOM_MAX) {
        zoomPercent = serverValue;
        cacheReaderPreference(localKey, String(serverValue));
      }
    }
  } catch (e) {
    // 서버 설정을 읽지 못해도 로컬 설정으로 계속 사용할 수 있다.
  }
}

function saveZoomPercent() {
  const key = readerSettingKey(ZOOM_BASE_KEY);
  cacheReaderPreference(localCacheKey(ZOOM_BASE_KEY), String(zoomPercent));
  fetch(`/api/settings/${encodeURIComponent(key)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value: String(zoomPercent) }),
  }).catch(() => {}); // 실패해도 로컬엔 이미 저장됐으니 기능은 그대로 동작
}

function captureScrollAnchor() {
  // 지금 뷰포트 맨 위에 걸쳐있는 이미지와, 그 이미지 안에서 몇 % 지점인지를 기록해둔다.
  // 확대/축소로 이미지 크기가 바뀐 뒤에도 "같은 이미지의 같은 지점"을 다시 찾아와 스크롤을
  // 맞추기 위한 기준점이다.
  const images = pagesEl.querySelectorAll("img");
  const scrollTop = window.scrollY;
  for (const img of images) {
    const rect = img.getBoundingClientRect();
    const top = rect.top + scrollTop;
    const bottom = top + rect.height;
    if (bottom > scrollTop) {
      const fraction = rect.height > 0 ? (scrollTop - top) / rect.height : 0;
      return { img, fraction };
    }
  }
  return null;
}

function restoreScrollAnchor(anchor) {
  if (!anchor || !anchor.img.isConnected) return;
  // getBoundingClientRect() 호출 자체가 최신 레이아웃을 강제로 계산하게 만들어서,
  // 방금 바뀐 이미지 크기가 이미 반영된 위치를 얻을 수 있다.
  const rect = anchor.img.getBoundingClientRect();
  const newTop = rect.top + window.scrollY;
  window.scrollTo(0, newTop + anchor.fraction * rect.height);
}

function setZoomCssVariable() {
  const isFullscreen = document.body.classList.contains("reader-fullscreen");
  if (isFullscreen) {
    applyFullscreenImageSizing();
  } else {
    clearFullscreenImageSizing();
    // 뷰포트보다 이미지가 원래 더 컸던 적이 없으므로(항상 화면 폭에 맞춰져 있었으므로),
    // 기준 폭은 "지금 화면 폭과 720px 중 작은 쪽" - 기존 100% 동작과 완전히 동일한 기준.
    const baseWidth = Math.min(window.innerWidth, ZOOM_BASE_WIDTH);
    const widthPx = Math.round((baseWidth * zoomPercent) / 100);
    document.documentElement.style.setProperty("--reader-image-width", `${widthPx}px`);
  }
  zoomValueLabelEl.textContent = `${zoomPercent}%`;
  zoomSliderEl.value = String(zoomPercent);
}

// 전체 화면에서는 원본 크기 기준으로 확대/축소를 계산해야 한다. 화면 폭 기준(vw)으로 상한을
// 씌우는 방식은, 원본 이미지 폭(보통 700~1000px)이 넓은 PC 모니터(예: 1920px)에서는 슬라이더의
// 최솟값(50%)보다도 이미 작아서 슬라이더가 전혀 효과가 없는 문제가 있었다(모바일은 원본이
// 화면보다 커서 우연히 동작했을 뿐). 그래서 각 이미지의 실제 원본 크기(naturalWidth)를 기준으로
// "원본과 화면 폭 중 작은 쪽 × 배율"을 직접 계산해서 그 이미지에만 적용한다.
function applyFullscreenImageSizing() {
  const images = pagesEl.querySelectorAll("img");
  for (const img of images) {
    sizeImageForFullscreen(img);
  }
}

function sizeImageForFullscreen(img) {
  if (!document.body.classList.contains("reader-fullscreen")) return;
  if (!img.naturalWidth) return; // 아직 로드 전이면 load 이벤트에서 다시 호출됨
  const base = Math.min(img.naturalWidth, window.innerWidth);
  const target = Math.round((base * zoomPercent) / 100);
  img.style.width = `${target}px`;
}

function clearFullscreenImageSizing() {
  // 일반 모드로 돌아오면 JS가 강제로 넣어둔 인라인 폭을 지워서, 공통 CSS 규칙
  // (--reader-image-width 변수 기반)이 다시 그대로 적용되게 한다.
  for (const img of pagesEl.querySelectorAll("img")) {
    img.style.width = "";
  }
}

function applyZoom() {
  const anchor = captureScrollAnchor();
  setZoomCssVariable();
  restoreScrollAnchor(anchor);
}

let isAdjustingZoom = false;

zoomSliderEl.addEventListener("input", () => {
  zoomPercent = parseInt(zoomSliderEl.value, 10);
  applyZoom();
  saveZoomPercent();
});
// 드래그 중에는 클릭/스크롤로 상단바·줄바가 숨겨지는 로직이 절대 끼어들지 못하게 막는다
// (특히 축소 방향으로 길게 끌 때 살짝 스크롤로 오인되어 줄바 자체가 사라져버리는 문제 방지)
for (const evt of ["pointerdown", "mousedown", "touchstart", "click"]) {
  zoomSliderEl.addEventListener(evt, (event) => event.stopPropagation());
}
zoomSliderEl.addEventListener("pointerdown", () => { isAdjustingZoom = true; });
window.addEventListener("pointerup", () => { isAdjustingZoom = false; });
zoomSliderEl.addEventListener("touchstart", () => { isAdjustingZoom = true; }, { passive: true });
window.addEventListener("touchend", () => { isAdjustingZoom = false; });

window.addEventListener("resize", () => {
  const img = pagesEl.querySelector(`img[data-chapter="${CSS.escape(currentChapterId || "")}"][data-page="${currentPageIndex}"]`);
  const anchor = img ? { img, fraction: currentPageOffset } : captureScrollAnchor();
  setZoomCssVariable();
  restoreScrollAnchor(anchor);
});

// ---------------------------------------------------------------------
// 회차 로딩 (무한 스크롤)
// ---------------------------------------------------------------------

function reachedProfileBoundary(chapter, boundary) {
  if (chapter?.lastImg?.dataset.imageState !== "loaded" || !boundary?.isConnected) return false;
  const rect = boundary.getBoundingClientRect();
  return rect.bottom > 0 && rect.top < window.innerHeight;
}

const loadMoreObserver = new IntersectionObserver(
  (entries) => {
    const last = loadedChapters.at(-1);
    for (const entry of entries) {
      if (entry.isIntersecting && entry.target.isConnected && entry.target.dataset.chapter === last?.id
          && (!IS_PROFILE_VIEW || reachedProfileBoundary(last, entry.target))) loadNextChapter();
    }
  },
  { root: document, rootMargin: IS_PROFILE_VIEW ? "0px" : "0px 0px 1200px 0px", threshold: IS_PROFILE_VIEW ? 0.01 : 0 }
);

const pageObserver = new IntersectionObserver(
  (entries) => {
    for (const entry of entries) {
      const key = entry.target.dataset.key;
      if (entry.isIntersecting) {
        visiblePages.set(key, entry.target);
      } else {
        visiblePages.delete(key);
      }
    }
    updateCurrentFromVisible();
  },
  { root: document, rootMargin: "400px 0px", threshold: 0 }
);

const visiblePages = new Map();

function updateReaderPosition() {
  const chapterIndex = seriesData && currentChapterId ? chapterIndexById(currentChapterId) : -1;
  previousChapterEl.disabled = chapterIndex < 1;
  nextChapterEl.disabled = chapterIndex < 0 || chapterIndex + 1 >= seriesData.chapters.length;
  if (chapterIndex < 0) return;
  const loaded = loadedChapters.find((ch) => ch.id === currentChapterId);
  const count = loaded?.pageCount || 0;
  const page = Math.min(currentPageIndex + 1, count);
  chapterProgressEl.max = Math.max(1, count);
  chapterProgressEl.value = page;
  const position = `${chapterIndex + 1} / ${seriesData.chapters.length}회차`;
  readerPositionEl.textContent = count ? `${position} · ${page} / ${count}페이지` : position;
}

function jumpAdjacentChapter(offset) {
  if (!seriesData || !currentChapterId) return;
  const index = chapterIndexById(currentChapterId);
  const chapter = index < 0 ? null : seriesData.chapters[index + offset];
  if (chapter) return jumpToChapter(chapter);
}
previousChapterEl.addEventListener("click", () => jumpAdjacentChapter(-1));
nextChapterEl.addEventListener("click", () => jumpAdjacentChapter(1));

function updateCurrentFromVisible() {
  if (pagesEl.classList.contains("positioning")) return;
  recordVisibleReading();
  let top = completedDocumentPosition();
  if (pendingJumpChapterId && top?.el.dataset.chapter !== pendingJumpChapterId) top = null;
  if (!top) {
    for (const el of visiblePages.values()) {
      if (el.isConnected === false) continue;
      if (pendingJumpChapterId && el.dataset.chapter !== pendingJumpChapterId) continue;
      const rect = el.getBoundingClientRect();
      if (!el.complete || !el.naturalWidth || !el.naturalHeight || rect.height <= 0
          || rect.bottom <= 0 || rect.top >= window.innerHeight) continue;
      if (!top || rect.top < top.rect.top) top = { el, rect };
    }
  }
  // A large jump can reach new images before IntersectionObserver reports them.
  if (!top) {
    const chapter = pendingJumpChapterId ? `[data-chapter="${CSS.escape(pendingJumpChapterId)}"]` : '';
    const images = pagesEl.querySelectorAll(`img[data-image-state="loaded"]${chapter}`);
    let start = 0;
    let end = images.length;
    // All pages are stacked in document order, so skipped geometry is offscreen.
    while (start < end) {
      const middle = (start + end) >>> 1;
      if (images[middle].getBoundingClientRect().bottom <= 0) start = middle + 1;
      else end = middle;
    }
    const el = images[start];
    if (el && (!pendingJumpChapterId || el.dataset.chapter === pendingJumpChapterId)) {
      const rect = el.getBoundingClientRect();
      if (el.complete && el.naturalWidth && el.naturalHeight && rect.height > 0
          && rect.bottom > 0 && rect.top < window.innerHeight) {
        top = { el, rect };
      }
    }
  }
  if (!top) return;
  const chapterId = top.el.dataset.chapter;
  const pageIndex = parseInt(top.el.dataset.page, 10);
  const chapterChanged = chapterId !== currentChapterId;
  const pageChanged = chapterChanged || pageIndex !== currentPageIndex;
  if (pageChanged) {
    const scopeId = activeProgressScope(chapterId);
    let insideScope = scopeId === null;
    for (const img of pagesEl.querySelectorAll("img")) {
      if (img === top.el) break;
      if (img.dataset.chapter === scopeId) insideScope = true;
      if (!insideScope) continue;
      if (pendingJumpChapterId && img.dataset.chapter !== pendingJumpChapterId) continue;
      if (img.dataset.imageState === "failed") return;
      if (!img.complete || !img.naturalWidth || !img.naturalHeight) {
        const rect = img.getBoundingClientRect();
        if (rect.height <= 0 || rect.bottom > 0) return;
      }
    }
  }
  pendingJumpChapterId = null;
  const offset = Math.round(Math.max(0, Math.min(1, -top.rect.top / top.rect.height)) * 100000) / 100000;
  const oldOffset = typeof currentPageOffset === "number" ? currentPageOffset : 0;
  if (pageChanged || Math.abs(offset - oldOffset) >= 0.001) {
    currentChapterId = chapterId;
    currentPageIndex = pageIndex;
    currentPageOffset = offset;
    onPositionChange(chapterChanged, pageChanged);
  }
}

function completedDocumentPosition() {
  if (typeof seriesData === "undefined" || !seriesData || !currentChapterId
      || pagesEl.classList.contains("positioning")) return null;
  const chapter = loadedChapters.find((item) => item.id === currentChapterId);
  const lastImage = chapter?.lastImg;
  if (!lastImage || !lastImage.complete || !lastImage.naturalWidth || !lastImage.naturalHeight) return null;
  const rect = lastImage.getBoundingClientRect();
  if (rect.height <= 0 || rect.bottom <= 0 || rect.top >= window.innerHeight || rect.bottom > window.innerHeight + 24) return null;
  if (!completedChapters.has(chapter.id)) return null;
  return { el: lastImage, rect };
}

function recordVisibleReading({ seed = false } = {}) {
  if ((!hasReadingInput && !seed) || document.hidden || pagesEl.classList.contains("positioning")) return;
  const chapter = loadedChapters.find((item) => item.id === currentChapterId);
  if (!chapter || completedChapters.has(chapter.id)) return;
  const previous = seriesData.chapters[chapterIndexById(chapter.id) - 1];
  const allowRecapSkip = previous && (previous.has_read || previous.read || completedChapters.has(previous.id));
  let fullyCovered = false;
  // The first wheel can arrive before IntersectionObserver reports the initial viewport.
  const candidates = new Set([chapter.firstImg, ...visiblePages.values()]);
  for (const img of candidates) {
    if (!img || img.isConnected === false || img.dataset.chapter !== chapter.id) continue;
    fullyCovered = readingEvidence.observe(img, img.getBoundingClientRect(), window.innerHeight, chapter.pageCount,
      allowRecapSkip ? chapter.skippedPages : 0);
    if (fullyCovered) break;
  }
  if (!hasReadingInput) return;
  const coverageChanged = readingEvidence.stage(chapter.id);
  if (fullyCovered) completedChapters.add(chapter.id);
  if (fullyCovered || coverageChanged) progressRevision++;
  if (coverageChanged) scheduleSaveProgress();
}

function noteReadingInput() {
  hasReadingInput = true;
  readingInputUntil = Date.now() + 1500;
  recordVisibleReading();
}


function onPositionChange(chapterChanged, pageChanged) {
  if (chapterChanged) {
    const ch = chapterById(currentChapterId);
    chapterTitleEl.textContent = ch ? `${seriesData.title} · ${ch.label}` : seriesData.title;
    highlightSidebar();
  }
  if (pageChanged) updateReaderPosition();
  scheduleSaveProgress();
  updateUrlState(currentChapterId, currentPageIndex, currentPageOffset);
}

function progressImageState(chapterId, pageIndex) {
  if (pagesEl.classList.contains("positioning")) return "unavailable";
  const scopeId = activeProgressScope(chapterId);
  let insideScope = scopeId === null;
  let failed = false;
  for (const img of pagesEl.querySelectorAll("img")) {
    if (img.dataset.chapter === scopeId) insideScope = true;
    if (!insideScope) continue;
    if (img.dataset.chapter === chapterId && Number(img.dataset.page) === pageIndex) {
      if (img.dataset.imageState === "failed" || !img.complete || !img.naturalWidth || !img.naturalHeight) return "unavailable";
      return failed ? "failed" : "ready";
    }
    if (img.dataset.imageState === "failed") failed = true;
  }
  return "unavailable";
}

function activeProgressScope(chapterId) {
  if (!readingFromChapterId) return null;
  return chapterIndexById(readingFromChapterId) <= chapterIndexById(chapterId) ? readingFromChapterId : chapterId;
}

let completionWrite = null;
function saveProgressNow({ keepalive = false, urgent = false } = {}) {
  if (closingProgressSaved || !currentChapterId) return Promise.resolve(true);

  if (typeof updateCurrentFromVisible === "function") updateCurrentFromVisible();
  progressWriter.cancelScheduled();
  const coverage = readingEvidence.snapshots();
  if (progressRevision === savedProgressRevision && !coverage.length) return Promise.resolve(true);

  // An unsuccessful jump can leave the previous chapter's final image in view.
  if (pendingJumpChapterId) return Promise.resolve(true);
  const chapterId = currentChapterId;
  const pageIndex = currentPageIndex;
  const imageState = progressImageState(chapterId, pageIndex);
  // Selecting a chapter can precede its manifest or first image; never save that provisional cursor.
  if (imageState === "unavailable") return Promise.resolve(true);
  if (imageState === "failed") {
    setProgressSaveError(true);
    const message = "불러오지 못한 이미지가 있어 읽음 위치를 확정하지 못했습니다. 해당 이미지를 다시 불러온 뒤 닫아주세요.";
    const label = document.getElementById("progressSaveError").querySelector?.("span");
    if (label) label.textContent = message;
    postReaderEvent("error", { code: "page_image_failed", message });
    return Promise.resolve(false);
  }
  const endPosition = typeof completedDocumentPosition === "function" ? completedDocumentPosition() : null;
  const reachedEnd = !!endPosition && endPosition.el.dataset.chapter === chapterId
    && Number(endPosition.el.dataset.page) === pageIndex;
  if (reachedEnd) completedChapterPosition = { chapterId, pageIndex };
  const completed = reachedEnd || (completedChapterPosition?.chapterId === chapterId
    && completedChapterPosition?.pageIndex === pageIndex);
  const revision = progressRevision;
  const readChapterIds = [...completedChapters].filter((id) => id !== chapterId && !persistedCompletedChapters.has(id));
  const body = { chapter_id: chapterId, page_index: pageIndex, completed, read_chapter_ids: readChapterIds.slice(0, 500) };
  body.reading_from_chapter_id = activeProgressScope(chapterId) ?? chapterId;
  if (typeof currentPageOffset === "number" && currentPageOffset > 0) body.page_offset = currentPageOffset;
  if (coverage.length) body.reading_coverage = coverage;
  // Completion is stored at the chapter boundary; viewport offsets at that boundary are equivalent.
  const completionKey = completed ? JSON.stringify([chapterId, pageIndex, body.reading_from_chapter_id, coverage]) : null;
  if (completionKey && completionWrite?.key === completionKey && (completionWrite.confirmed || !urgent)) {
    return completionWrite.promise;
  }
  const promise = progressWriter.write(body, { keepalive, urgent }).then((result) => {
    if (completionWrite?.promise === promise) {
      if (result.ok && result.saved && result.latest) completionWrite.confirmed = true;
      else completionWrite = null;
    }
    if (result.ok) {
      if (!result.saved) return false;
      savedProgressRevision = Math.max(savedProgressRevision, revision);
      readingEvidence.acknowledge(coverage);
      if (readingEvidence.snapshots().length) scheduleSaveProgress();
      for (const id of body.read_chapter_ids) persistedCompletedChapters.add(id);
      if (completed) persistedCompletedChapters.add(chapterId);
      if (result.latest) setProgressSaveError(false);
      if (result.saved && result.latest) postReaderEvent("progress", body);
      return true;
    }
    if (result.latest) {
      if (embedBridge?.active) setProgressSaveError(true);
      postReaderEvent("error", { code: "progress_save_failed", message: "읽은 위치를 저장하지 못했습니다. 다시 시도해주세요." });
    }
    return false;
  });
  completionWrite = completionKey ? { key: completionKey, promise, confirmed: false } : null;
  return promise;
}

function scheduleSaveProgress() {
  progressWriter.scheduleSave(() => saveProgressNow());
}

let endOfDocumentCheckQueued = false;
function confirmLastChapterAtDocumentEnd() {
  if (endOfDocumentCheckQueued) return;
  endOfDocumentCheckQueued = true;
  requestAnimationFrame(() => {
    endOfDocumentCheckQueued = false;
    recordVisibleReading();
    if (!completedDocumentPosition()) return;
    updateCurrentFromVisible();

    saveProgressNow({ keepalive: true });
  });
}

window.addEventListener("scroll", confirmLastChapterAtDocumentEnd, { passive: true });
let progressFrame = null;
let observedScrollY = window.scrollY;
window.addEventListener("scroll", () => {
  if (window.scrollY !== observedScrollY && !pendingAnchor && !pagesEl.classList.contains("positioning")
      && (Date.now() <= readingInputUntil || autoScrollActive || scrollAnimationFrame !== null)) progressRevision++;
  observedScrollY = window.scrollY;
  if (progressFrame !== null) return;
  progressFrame = requestAnimationFrame(() => { progressFrame = null; updateCurrentFromVisible(); });
}, { passive: true });
for (const type of ["wheel", "touchmove", "pointerdown"]) {
  window.addEventListener(type, (event) => {
    if (event.isTrusted && (type !== "pointerdown" || event.clientX >= document.documentElement.clientWidth)) noteReadingInput();
  }, { passive: true });
}
window.addEventListener("keydown", (event) => {
  if (event.isTrusted && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "AudioVolumeDown", "AudioVolumeUp", "PageUp", "PageDown", "Home", "End", " "].includes(event.key)
      && !event.target.closest?.("input, textarea, button, select")) noteReadingInput();
});
window.addEventListener("pagehide", () => {
  // 종료 전에 현재 위치를 keepalive로 즉시 전송한다.
  pauseReaderScrolling();
  saveProgressNow({ keepalive: true, urgent: true });
});

// ---------------------------------------------------------------------
// 프리페치 (다음 화 이미지를 미리 브라우저 캐시에 받아둠)
// ---------------------------------------------------------------------

const prefetchedChapterIds = new Set();
let prefetchedChapterOverlap = null;

function prefetchImages(urls) {
  for (const url of urls) {
    const img = new Image();
    img.fetchPriority = "low"; // 지금 보고 있는 화면의 로딩을 방해하지 않도록
    const deadline = setTimeout(() => { img.removeAttribute("src"); }, 15_000);
    img.onload = img.onerror = () => clearTimeout(deadline);
    img.src = url;
  }
}

function pageImageLoaded(img) {
  sizeImageForFullscreen(img);
  img.parentElement?.querySelector(".reader-image-error")?.remove();
  restorePendingAnchor();
  updateCurrentFromVisible();
  confirmLastChapterAtDocumentEnd();
  if (IS_PROFILE_VIEW) {
    const last = loadedChapters.at(-1);
    if (last?.lastImg === img && reachedProfileBoundary(last, pagesEl.querySelector(".reader-next-boundary"))) {
      loadNextChapter();
    }
  }
}

function imageFailed(img, retry) {
  const wrap = img.parentElement;
  if (!wrap || wrap.querySelector(".reader-image-error")) return;
  const notice = document.createElement("div");
  notice.className = "reader-image-error";
  const label = document.createElement("span");
  label.textContent = `${Number(img.dataset.page) + 1}페이지를 불러오지 못했습니다.`;
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "이미지 다시 불러오기";
  button.addEventListener("click", async (event) => {
    event.stopPropagation();
    button.disabled = true;
    const ok = await retry();
    if (!ok) button.disabled = false;
  });
  notice.append(label, button);
  wrap.appendChild(notice);
}

function newImageLoader() {
  return WebtoonReaderImages.createLoader({
    // The implicit root clips embedded readers at the iframe edge before applying the lead margin.
    observerFactory: (callback, options) => new IntersectionObserver(callback, { ...options, root: document }),
    onLoaded: pageImageLoaded,
    onFailed: imageFailed,
  });
}
let imageLoader = newImageLoader();

function createPageImage(chapter, page, size) {
  const wrap = document.createElement("div");
  wrap.className = "reader-page";
  const img = document.createElement("img");
  img.dataset.chapter = chapter.id;
  img.dataset.page = String(page);
  img.dataset.key = `${chapter.id}:${page}`;
  img.alt = `${page + 1}페이지`;
  img.decoding = "async";
  wrap.appendChild(img);
  imageLoader.register(img, withProfilePrefix(`/api/chapters/${encodeURIComponent(chapter.id)}/pages/${page}`), size);
  pageObserver.observe(img);
  return { img, wrap };
}

let pendingAnchor = null;
let anchorTimeout = null;
function restorePendingAnchor() {
  if (pendingAnchor?.img.isConnected) restoreScrollAnchor(pendingAnchor);
}
function cancelPendingAnchor() {
  pendingAnchor = null;
  clearTimeout(anchorTimeout);
  revealPages();
}
const restoreResizeObserver = new ResizeObserver(restorePendingAnchor);
restoreResizeObserver.observe(pagesEl);
for (const type of ["wheel", "touchstart", "pointerdown"]) {
  window.addEventListener(type, cancelPendingAnchor, { passive: true });
}
window.addEventListener("keydown", (event) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "AudioVolumeDown", "AudioVolumeUp", "PageUp", "PageDown", "Home", "End", " "].includes(event.key)) cancelPendingAnchor();
});

async function positionAtImage(img, fraction = 0) {
  cancelPendingAnchor();
  pendingAnchor = { img, fraction };
  beginPositioning();
  restorePendingAnchor();
  positioningTimer = setTimeout(revealPages, 4000);
  const ok = await imageLoader.ensure(img, { priority: true });
  if (pendingAnchor?.img !== img) return false;
  if (ok) restorePendingAnchor();
  revealPages();
  anchorTimeout = setTimeout(() => { pendingAnchor = null; }, 4000);
  return ok;
}

async function prefetchNextChapter(afterChapterId) {
  const idx = chapterIndexById(afterChapterId);
  const next = idx >= 0 ? seriesData.chapters[idx + 1] : null;
  if (!next || prefetchedChapterIds.has(next.id)) return;
  prefetchedChapterIds.add(next.id);

  // Warm just the first image without requesting the next chapter's manifest.
  prefetchImages([withProfilePrefix(`/api/chapters/${encodeURIComponent(next.id)}/pages/0`)]);
  await chapterOverlap(next.id);
}

function chapterOverlap(chapterId) {
  if (prefetchedChapterOverlap?.chapterId === chapterId) return prefetchedChapterOverlap.promise;
  const promise = (async () => {
    const res = await fetch(`/api/chapters/${encodeURIComponent(chapterId)}/overlap`, {
      signal: globalThis.AbortSignal?.timeout?.(10_000),
    });
    if (!res.ok) return null;
    const { skip_pages: skip } = await res.json();
    return Number.isInteger(skip) && skip >= 0 ? skip : null;
  })().catch(() => null);
  prefetchedChapterOverlap = { chapterId, promise };
  promise.then((skip) => {
    if (skip === null && prefetchedChapterOverlap?.promise === promise) prefetchedChapterOverlap = null;
  });
  return promise;
}

async function revealSkippedPages(chapter, skipCount, wrapEl) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < skipCount; i++) {
    const sizes = loadedChapters.find((item) => item.id === chapter.id)?.pageSizes;
    const { wrap } = createPageImage(chapter, i, sizes?.[i]);
    frag.appendChild(wrap);
  }
  wrapEl.replaceWith(frag);
}

function showChapterLoadError(chapter, options, message) {
  stopAutoScroll();
  revealPages();
  pagesEl.querySelector(".reader-next-boundary")?.remove();
  pagesEl.querySelector(".reader-chapter-error")?.remove();
  const notice = document.createElement("div");
  notice.className = "reader-chapter-error";
  notice.setAttribute("role", "alert");
  const label = document.createElement("span");
  label.textContent = message;
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "회차 다시 불러오기";
  button.addEventListener("click", async () => {
    if (isLoadingNext) return;
    const activeChapters = loadedChapters;
    button.disabled = true;
    notice.setAttribute("role", "status");
    label.textContent = "회차를 다시 불러오는 중…";
    isLoadingNext = true;
    try { await appendChapter(chapter, options); }
    finally { if (activeChapters === loadedChapters) isLoadingNext = false; }
  });
  notice.append(label, button);
  pagesEl.appendChild(notice);
  postReaderEvent("error", { code: "chapter_load_failed", message });
}

async function appendChapter(chapter, { scrollToPage = null, pageOffset = 0, skipPages = 0 } = {}) {
  const activeChapters = loadedChapters;
  loadMoreObserver.disconnect();

  const options = { scrollToPage, pageOffset, skipPages };
  const boundary = pagesEl.querySelector(".reader-next-boundary");
  const previousError = pagesEl.querySelector(".reader-chapter-error");
  let data;
  try {
    const res = await fetch(`/api/chapters/${encodeURIComponent(chapter.id)}/pages?dimensions=1&start_reading=true`, {
      signal: globalThis.AbortSignal?.timeout?.(30_000),
    });
    if (!res.ok) {
      const errorBody = await res.json().catch(() => ({}));
      if (activeChapters !== loadedChapters) return false;
      const restricted = res.status === 403 && errorBody.detail?.reason === "outside_allowed_reading_time";
      showChapterLoadError(chapter, options, restricted
        ? readingTimeMessage(errorBody.detail.windows)
        : "회차를 불러오지 못했습니다. 연결을 확인하고 다시 시도해주세요.");
      return false;
    }
    data = await res.json();
    if (!Number.isInteger(data.page_count) || data.page_count <= 0) throw new Error("empty chapter");
  } catch (_) {
    if (activeChapters === loadedChapters) {
      showChapterLoadError(chapter, options, "회차를 불러오지 못했습니다. 연결을 확인하고 다시 시도해주세요.");
    }
    return false;
  }
  const pageCount = data.page_count || 0;
  const startPage = Math.min((await skipPages) ?? 0, pageCount - 1);
  if (activeChapters !== loadedChapters) return false;
  if (data.zip_generation) {
    const coverage = data.reading_coverage;
    readingEvidence.restore(chapter.id, data.zip_generation, coverage?.page_index < pageCount ? coverage : null);
  }
  boundary?.remove();
  previousError?.remove();

  if (startPage > 0) {
    const wrap = document.createElement("div");
    wrap.className = "overlap-reveal-wrap";
    const revealBtn = document.createElement("button");
    revealBtn.className = "overlap-reveal-btn";
    revealBtn.title = "이전 화와 겹치는 페이지 펼쳐보기";
    revealBtn.setAttribute("aria-label", "건너뛴 페이지 펼쳐보기");
    revealBtn.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="6 9 12 15 18 9"></polyline></svg>';
    revealBtn.addEventListener("click", () => revealSkippedPages(chapter, startPage, wrap));
    wrap.appendChild(revealBtn);
    pagesEl.appendChild(wrap);
  }

  let targetImg = null;
  const targetPage = scrollToPage === null ? null : Math.max(startPage, Math.min(scrollToPage, pageCount - 1));
  let lastImg = null;
  let firstImg = null;
  for (let i = startPage; i < pageCount; i++) {
    const { img, wrap } = createPageImage(chapter, i, data.page_sizes?.[i]);
    pagesEl.appendChild(wrap);
    lastImg = img;
    if (i === startPage) firstImg = img;
    if (i === targetPage) targetImg = img;
  }

  loadedChapters.push({ id: chapter.id, pageCount, firstImg, lastImg, pageSizes: data.page_sizes, skippedPages: startPage });
  updateReaderPosition();

  if (targetImg) {
    await positionAtImage(targetImg, targetPage === scrollToPage ? pageOffset : 0);
  } else if (pagesEl.classList.contains("positioning")) {
    revealPages();
  }

  if (activeChapters !== loadedChapters) return false;
  const idx = chapterIndexById(chapter.id);
  const hasNext = idx >= 0 && idx < seriesData.chapters.length - 1;
  if (hasNext && lastImg) {
    const nextBoundary = document.createElement("div");
    nextBoundary.className = "reader-next-boundary";
    nextBoundary.dataset.chapter = chapter.id;
    nextBoundary.setAttribute("role", "status");
    pagesEl.appendChild(nextBoundary);
    // A shared profile must keep the current chapter grant until the reader actually reaches its end.
    loadMoreObserver.observe(IS_PROFILE_VIEW ? nextBoundary : lastImg);
    prefetchNextChapter(chapter.id); // 지금 화가 화면에 붙는 즉시 다음 화 앞부분을 미리 받아둠
  } else if (!hasNext) {
    appendEndCard();
  }
  if (previousError) postReaderEvent("ready", { chapter_id: currentChapterId, page_index: currentPageIndex });
  return true;
}

async function loadNextChapter() {
  if (isLoadingNext) return;
  const activeChapters = loadedChapters;
  const last = activeChapters.at(-1);
  if (!last) return;
  const idx = chapterIndexById(last.id);
  const next = idx >= 0 ? seriesData.chapters[idx + 1] : null;
  if (!next) return;
  isLoadingNext = true;
  const boundary = pagesEl.querySelector(".reader-next-boundary");
  if (boundary) {
    boundary.classList.add("loading");
    boundary.textContent = "다음 회차를 불러오는 중…";
  }
  try {
    const overlap = chapterOverlap(next.id);
    // A shared profile grants reading time only when the chapter is opened.
    const skipPages = IS_PROFILE_VIEW ? await overlap : overlap;
    if (activeChapters === loadedChapters) await appendChapter(next, { skipPages });
  } finally {
    if (activeChapters === loadedChapters) isLoadingNext = false;
  }
}

function appendEndCard() {
  const el = document.createElement("div");
  el.className = "next-chapter";
  el.innerHTML = `
    <a class="next-card" href="${withProfilePrefix("/")}">
      <span class="eyebrow">마지막 화입니다</span>
      <span class="next-title">웹툰 목록으로 →</span>
    </a>
  `;
  pagesEl.appendChild(el);
}

// ---------------------------------------------------------------------
// 사이드 회차 패널
// ---------------------------------------------------------------------

function renderSidebar() {
  const ordered = Array.from(seriesData.chapters.entries());
  if (sidebarEpisodeOrderEl.value === "latest") ordered.reverse();
  sidebarListEl.replaceChildren();
  ordered.forEach(([idx, ch]) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "sidebar-row";
    row.dataset.chapterId = ch.id;
    row.dataset.idx = String(idx);
    const label = document.createElement("span");
    label.className = "sidebar-row-label";
    label.textContent = ch.label;
    const status = document.createElement("span");
    status.className = "sidebar-row-status";
    row.append(label, status);
    row.addEventListener("click", () => jumpToChapter(ch));
    sidebarListEl.appendChild(row);
  });
  filterSidebarChapters();
  highlightSidebar();
}

function highlightSidebar() {
  for (const row of sidebarListEl.querySelectorAll(".sidebar-row")) {
    const idx = parseInt(row.dataset.idx, 10);
    const ch = seriesData.chapters[idx];
    const isCurrent = row.dataset.chapterId === currentChapterId;
    row.classList.toggle("active", isCurrent);
    if (isCurrent) row.setAttribute("aria-current", "true");
    else row.removeAttribute("aria-current");

    const statusEl = row.querySelector(".sidebar-row-status");
    // "지금 보고 있는 회차"라는 정보가 "예전에 읽었는지"보다 우선한다 - 이미 읽었던
    // 회차로 다시 돌아가서 보면(예: 10화까지 읽다가 2화를 다시 열어봄), 예전에는
    // "이미 읽음"이 먼저 이겨버려서 "읽는 중"이 뜰 자리가 없는 문제가 있었다.
    const effectiveRead = ch?.has_read || ch?.read || completedChapters.has(ch?.id);
    if (isCurrent) {
      statusEl.textContent = "읽는 중";
      statusEl.className = "sidebar-row-status reading";
    } else if (effectiveRead) {
      statusEl.textContent = "읽음";
      statusEl.className = "sidebar-row-status read";
    } else {
      statusEl.textContent = "";
      statusEl.className = "sidebar-row-status";
    }
  }
}

const POSITION_URL_INTERVAL_MS = 500;
let lastPositionUrlAt = -Infinity;
let positionUrlTimer = null;
let pendingPositionUrl = null;

function updateUrlState(chapterId, page, offset = 0) {
  pendingPositionUrl = { chapterId, page, offset };
  if (positionUrlTimer !== null) return;
  const flush = () => {
    positionUrlTimer = null;
    lastPositionUrlAt = Date.now();
    const position = pendingPositionUrl;
    const p = new URLSearchParams(location.search);
    p.set("series", seriesId);
    p.set("chapter", position.chapterId);
    p.set("page", String(position.page));
    if (Number.isFinite(position.offset) && position.offset > 0 && position.offset <= 1) {
      p.set("page_offset", String(position.offset));
    } else {
      p.delete("page_offset");
    }
    try {
      history.replaceState(null, "", `${location.pathname}?${p.toString()}`);
    } catch (_) {
      // Some browsers reject history writes during rapid scrolling or when leaving the page.
    }
  };
  const delay = POSITION_URL_INTERVAL_MS - (Date.now() - lastPositionUrlAt);
  if (delay > 0) positionUrlTimer = setTimeout(flush, delay);
  else flush();
}

let chapterJumpSequence = 0;
async function jumpToChapter(ch) {
  const sequence = ++chapterJumpSequence;
  pauseReaderScrolling();
  // Save while the old chapter is still mounted. A failed target leaves that position intact.
  const differentChapter = currentChapterId !== ch.id;
  if (differentChapter) {
    await saveProgressNow({ keepalive: true });
    if (sequence !== chapterJumpSequence || closingProgressSaved) return;
  }
  const loaded = loadedChapters.find((chapter) => chapter.id === ch.id);
  const target = loaded && (pagesEl.querySelector(`img[data-chapter="${CSS.escape(ch.id)}"][data-page="0"]`) || loaded.firstImg);
  readingFromChapterId = ch.id;
  completedChapterPosition = null;
  readingInputUntil = 0;
  hasReadingInput = false;
  currentChapterId = ch.id;
  pendingJumpChapterId = ch.id;
  currentPageIndex = Number(target?.dataset.page) || 0;
  currentPageOffset = 0;
  cancelPendingAnchor();
  setChromeHidden(false);
  chapterTitleEl.textContent = `${seriesData.title} · ${ch.label}`;
  highlightSidebar();
  if (document.getElementById("sidebar").classList.contains("open")) closeSidebar();

  updateReaderPosition();
  if (target) {
    if (!await positionAtImage(target, 0) || sequence !== chapterJumpSequence) return;
  } else {
    pageObserver.disconnect();
    loadMoreObserver.disconnect();
    imageLoader.destroy();
    imageLoader = newImageLoader();
    visiblePages.clear();
    pagesEl.replaceChildren();
    loadedChapters = [];
    isLoadingNext = false;

    beginPositioning();
    if (!await appendChapter(ch, { scrollToPage: 0 }) || sequence !== chapterJumpSequence) return;
  }

  updateCurrentFromVisible();
  if (pendingJumpChapterId || currentChapterId !== ch.id || progressImageState(currentChapterId, currentPageIndex) !== "ready") return;
  recordVisibleReading({ seed: true });
  progressRevision++;
  scheduleSaveProgress();
  updateUrlState(currentChapterId, currentPageIndex, currentPageOffset);
}

let sidebarReturnFocus = null;

function filterSidebarChapters() {
  const search = document.getElementById("sidebarSearch");
  const query = search.value.trim().normalize("NFKC").toLocaleLowerCase("ko-KR");
  const numberQuery = query.match(/^(\d+(?:\.\d+)?)(?:\s*화)?$/);
  let hasResults = false;
  for (const row of sidebarListEl.querySelectorAll(".sidebar-row")) {
    const chapter = seriesData.chapters[Number(row.dataset.idx)];
    const label = chapter.label.normalize("NFKC").toLocaleLowerCase("ko-KR");
    const number = label.match(/^(?:제\s*)?(\d+(?:\.\d+)?)/)?.[1] ?? chapter.sort_key;
    row.hidden = numberQuery ? Number(number) !== Number(numberQuery[1]) : !label.includes(query);
    if (!row.hidden) hasResults = true;
  }
  document.getElementById("clearSidebarSearch").disabled = search.value.length === 0;
  document.getElementById("sidebarSearchEmpty").hidden = hasResults || !query;
}

function focusCurrentSidebarChapter() {
  const search = document.getElementById("sidebarSearch");
  if (search.value) {
    search.value = "";
    filterSidebarChapters();
  }
  const active = sidebarListEl.querySelector(".sidebar-row.active");
  if (active) active.scrollIntoView({ block: "center" });
  (active || document.getElementById("sidebarClose")).focus({ preventScroll: true });
}

function openSidebar() {
  pauseReaderScrolling();
  sidebarReturnFocus = document.activeElement;
  const sidebar = document.getElementById("sidebar");
  sidebar.inert = false;
  sidebar.classList.add("open");
  document.getElementById("sidebarOverlay").classList.add("open");
  document.getElementById("sidebarToggle").setAttribute("aria-expanded", "true");
  const search = document.getElementById("sidebarSearch");
  if (search.value) {
    search.value = "";
    filterSidebarChapters();
  }
  sidebarListEl.scrollTop = 0;
  document.getElementById("sidebarClose").focus({ preventScroll: true });
}

function closeSidebar() {
  const sidebar = document.getElementById("sidebar");
  if (!sidebar.classList.contains("open")) return;
  sidebar.classList.remove("open");
  sidebar.inert = true;
  document.getElementById("sidebarOverlay").classList.remove("open");
  document.getElementById("sidebarToggle").setAttribute("aria-expanded", "false");
  if (sidebarReturnFocus?.isConnected) sidebarReturnFocus.focus({ preventScroll: true });
  else document.getElementById("sidebarToggle").focus({ preventScroll: true });
}

function handleSidebarKeyDown(event) {
  const sidebar = document.getElementById("sidebar");
  if (!sidebar.classList.contains("open")) return;
  if (event.key === "Escape") {
    event.preventDefault();
    closeSidebar();
    return;
  }
  if (event.key === "Tab") {
    const controls = sidebar.querySelectorAll("button:not(:disabled):not([hidden]), input:not(:disabled), select:not(:disabled)");
    if (!controls.length) return;
    const first = controls[0], last = controls[controls.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  } else if (["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) {
    if (document.activeElement === document.getElementById("sidebarSearch") || document.activeElement === sidebarEpisodeOrderEl) return;
    const rows = Array.from(sidebarListEl.querySelectorAll(".sidebar-row:not([hidden])"));
    if (!rows.length) return;
    event.preventDefault();
    const index = rows.indexOf(document.activeElement);
    const next = event.key === "Home" ? 0 : event.key === "End" ? rows.length - 1
      : Math.max(0, Math.min(rows.length - 1, index + (event.key === "ArrowDown" ? 1 : -1)));
    rows[next].focus();
  }
}
document.getElementById("sidebar").addEventListener("keydown", handleSidebarKeyDown);

document.getElementById("sidebarToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("sidebarSearch").addEventListener("input", filterSidebarChapters);
const EPISODE_ORDER_KEY = "webtoonEpisodeOrder";
try {
  if (localStorage.getItem(EPISODE_ORDER_KEY) === "oldest") sidebarEpisodeOrderEl.value = "oldest";
} catch (_) {
  // The selector still works for the current visit without storage.
}
sidebarEpisodeOrderEl.addEventListener("change", () => {
  try {
    localStorage.setItem(EPISODE_ORDER_KEY, sidebarEpisodeOrderEl.value);
  } catch (_) {
    // Use the selected order even when persistence is unavailable.
  }
  if (seriesData) renderSidebar();
  sidebarListEl.scrollTop = 0;
});
window.addEventListener("storage", (event) => {
  if (event.key !== EPISODE_ORDER_KEY && event.key !== null) return;
  const order = event.newValue === "oldest" ? "oldest" : "latest";
  if (sidebarEpisodeOrderEl.value === order) return;
  sidebarEpisodeOrderEl.value = order;
  if (seriesData) renderSidebar();
  sidebarListEl.scrollTop = 0;
});
document.getElementById("clearSidebarSearch").addEventListener("click", () => {
  const search = document.getElementById("sidebarSearch");
  search.value = "";
  filterSidebarChapters();
  search.focus();
});
document.getElementById("focusCurrentChapter").addEventListener("click", focusCurrentSidebarChapter);

async function moveToChapterBoundary(end) {
  stopContinuousScroll();
  stopAutoScroll();
  cancelPendingAnchor();
  const loaded = loadedChapters.find((chapter) => chapter.id === currentChapterId);
  if (!loaded) return;
  const img = end ? loaded.lastImg
    : pagesEl.querySelector(`img[data-chapter="${CSS.escape(currentChapterId)}"][data-page="0"]`) || loaded.firstImg;
  if (!img) return;
  readingInputUntil = 0;
  hasReadingInput = false;
  completedChapterPosition = null;
  const height = img.getBoundingClientRect().height;
  const targetOffset = end && height > 0 ? Math.max(0, 1 - window.innerHeight / height) : 0;
  const positioned = await positionAtImage(img, targetOffset);
  updateCurrentFromVisible();
  if (positioned && currentChapterId === loaded.id && currentPageIndex === Number(img.dataset.page)) {
    recordVisibleReading({ seed: true });
    progressRevision++;
    scheduleSaveProgress();
  }
  updateReaderPosition();
  setChromeHidden(false);
}
document.getElementById("chapterTop").addEventListener("click", () => moveToChapterBoundary(false));
document.getElementById("chapterBottom").addEventListener("click", () => moveToChapterBoundary(true));


// ---------------------------------------------------------------------
// 상단바 자동 숨김 + 화면 클릭 시 토글
// ---------------------------------------------------------------------

let lastY = window.scrollY;
const topbar = document.getElementById("topbar");
const zoomBar = document.getElementById("zoomBar");
const readerQuickTools = document.getElementById("readerQuickTools");
const showReaderTools = document.getElementById("showReaderTools");

function setChromeHidden(hidden) {
  if (isAdjustingZoom) return; // 슬라이더 조작 중엔 숨김 로직이 절대 끼어들지 않게
  const focused = document.activeElement;
  const activeInToolbar = topbar.contains(focused) || zoomBar.contains(focused);
  if (hidden && activeInToolbar && focused.matches(":focus-visible")) return;
  const activeInQuickTools = readerQuickTools.contains(focused);
  topbar.classList.toggle("hidden", hidden);
  zoomBar.classList.toggle("hidden", hidden);
  topbar.inert = hidden;
  zoomBar.inert = hidden;
  readerQuickTools.hidden = !hidden;
  if (hidden && activeInToolbar) showReaderTools.focus({ preventScroll: true });
  if (!hidden && activeInQuickTools) autoScrollToggleEl.focus({ preventScroll: true });
}

showReaderTools.addEventListener("click", () => {
  pauseReaderScrolling();
  setChromeHidden(false);
});
stopHiddenAutoScrollEl.addEventListener("click", () => {
  setChromeHidden(false);
  pauseReaderScrolling();
});

window.addEventListener(
  "scroll",
  () => {
    const y = window.scrollY;
    // Position restoration can move the document far down without a reader scroll gesture.
    if (!pendingAnchor) setChromeHidden(y > lastY && y > 80);
    lastY = y;
  },
  { passive: true }
);

pagesEl.addEventListener("click", (e) => {
  if (e.target.closest("button, input, select")) return;
  const link = e.target.closest("a");
  if (link && link.getAttribute("href") === withProfilePrefix("/")) {
    // 마지막 화의 "웹툰 목록으로" 링크로 나갈 때도 전체 화면을 확실히 해제한다.
    e.preventDefault();
    leaveReaderForList(e);
    return;
  }
  // 링크(다음 화 카드 등) 클릭은 그대로 이동하도록 두고 토글만 별도로 처리
  setChromeHidden(!topbar.classList.contains("hidden"));
});

// ---------------------------------------------------------------------
// 초기 로딩
// ---------------------------------------------------------------------

async function load() {
  if (!await initializeEmbed()) return;
  if (!seriesId) return showError();

  const positionRequest = WebtoonReaderPosition.resolve({
    seriesId, chapterId: initialChapterId, pageIndex: initialPage, pageOffset: initialOffset,
    fetcher: window.fetch.bind(window),
  });
  const chaptersRequest = fetch(`/api/series/${encodeURIComponent(seriesId)}/chapters`);
  // The preference scope determines the keys for the remaining settings.
  const settingsRequest = loadReaderSettingsScope().then(() =>
    Promise.all([loadScrollSpeed(), readFullscreenPreference(), loadZoomPercent()]));
  const [position, chaptersResponse] = await Promise.all([positionRequest, chaptersRequest, settingsRequest]);
  if (!chaptersResponse.ok) return showError();
  seriesData = await chaptersResponse.json();

  initialChapterId = position.chapterId;
  initialPage = position.pageIndex;
  initialOffset = position.pageOffset || 0;

  if (fullscreenPreference) {
    // CSS 기반 리더 전체 화면은 자동 적용할 수 있다. 브라우저의 실제 전체 화면 API는
    // 보안상 사용자 제스처가 필요할 수 있으므로, 여기서는 가능한 경우에만 시도한다.
    setReaderFullscreen(true, { persist: false, requestBrowserFullscreen: true });
  } else {
    updateFullscreenButton();
    applyZoom();
  }

  document.title = seriesData.title;
  document.getElementById("sidebarTitle").textContent = seriesData.title;
  renderSidebar();

  const startChapter = chapterById(initialChapterId) || seriesData.chapters[0];
  if (!startChapter) return showError();

  currentChapterId = startChapter.id;
  pendingJumpChapterId = startChapter.id;
  readingFromChapterId = startChapter.id;
  currentPageIndex = initialPage;
  currentPageOffset = initialOffset;
  chapterTitleEl.textContent = `${seriesData.title} · ${startChapter.label}`;
  highlightSidebar();

  if (initialPage > 0 || initialOffset > 0) beginPositioning();

  await appendChapter(startChapter, { scrollToPage: initialPage, pageOffset: initialOffset });
  updateCurrentFromVisible();
  recordVisibleReading({ seed: true });
  if (pagesEl.querySelector("img")) postReaderEvent("ready", { chapter_id: currentChapterId, page_index: currentPageIndex });
}

load().catch(showError);
</script>
